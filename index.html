<!DOCTYPE html>
<html>
  <title>Math Pratice Borad</title>
  <style
    body { background #111;color: white; text-align: center; font-family: sans-serif; }
    canvas { background #000; color: white; text-align center; font-family: sans-serif; }
    </style>
</head>
<body>
    <h3LogicExcercise Grid<h3>
    <canvas id="stage" width="400" height="400"></canvas>
    <script>
       const canvas = document.getElementById('stage');
       const ctx = canvas.getContext('2d');
       let snake = [{x: 160, y:160}, {x: 144, y: 160}, {x: 128, y: 160}
       let dx = 16, dy = 0, appleX = 96, appleY = 96, score = 0;

      function maine () { 
    if (game0ver()) retrun alert('Game Over. Refresh to restart.');
    setTimeout(function() {
      clearCanvas();
      drawApple();
      moveSnake();
      main();
      }, 100);
       }
    function clearCanvas() { ctx.fillStyle = 'black'; ctx.fillRect(0,0, canvas.width, canvas.height); }
    function drawSnake() { ctx.fillStyle = 'lightgreen'; snake.for Each(part => ctx.fillRect(part.x, part.y, 14,14)); }
    function moveSnake() {
        const head = {x: snake[0].x + dx, y: snake[0].y + dy};
        snake.unshift(head);
        if (snake[0].x === appleX && snake[0].y === appleY) {
          score += 10;
          appleX = Math.floor(Math.random() * 25) * 16;
          appleY = Math.floor(Math.random() * 25) * 16;
        }else { snake.pop(); }
               }
        function drawApple() { ctx.fillStyle = 'red'; ctx.fillRect(appleX, appleY, 14, 14); }
        function game0ver() {
          for (let i = 4; i < snake.length; i++) { if ( snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true; }
          return snake[0].x < 0 || snake[0].x >= canvas.width || snake[0].y < 0 || snake[0].y >= canvas.height;
        }
        window.addEventListener('keydown', e => {
          if (e.key === 'ArrowLeft' && dx === 0) { dx = -16; dy = 0; }
          if (e.key === 'ArrowUp' && dy === 0) { dx = 0; dy = -16; }
          if (e.key === 'ArrowRight' && dx === 0) { dx = 16; dy = 0; }
          if (e.key === 'ArrowDown' && dx === 0) { dx = 0; dy = 16; }
        });
          main();
          </script>
          </body>
          </html>
